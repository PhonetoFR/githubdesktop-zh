<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Desktop 汉化补丁</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="window-drag-region" aria-hidden="true"></div>
    <main class="shell">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <circle cx="7" cy="5" r="2.25"></circle>
            <circle cx="17" cy="8" r="2.25"></circle>
            <circle cx="7" cy="19" r="2.25"></circle>
            <path d="M7 7.25v9.5M9.25 10.5h3.5A4.25 4.25 0 0 0 17 6.25"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <div class="title-line">
            <h1>GitHub Desktop 汉化补丁</h1>
            <span class="version" id="tool-version">--</span>
          </div>
          <p>安全应用简体中文翻译，随时可还原。</p>
        </div>
      </header>

      <section
        class="desktop-state"
        aria-label="GitHub Desktop 运行状态"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="state-copy">
          <span class="eyebrow">应用状态</span>
          <strong id="process-title">正在检测 GitHub Desktop</strong>
          <span id="process-description">请稍候</span>
        </div>
        <div class="state-indicator" id="process-indicator">
          <span class="indicator-dot"></span>
          <span id="process-label">检测中</span>
        </div>
      </section>

      <section class="panel" id="operation-panel" aria-labelledby="install-title" aria-busy="false">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">目标安装</span>
            <h2 id="install-title">选择 GitHub Desktop 版本</h2>
          </div>
          <button class="icon-button" id="refresh-button" type="button" aria-label="刷新状态" title="刷新状态">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6"></path>
            </svg>
          </button>
        </div>

        <label class="field" for="version-select">
          <span>安装版本</span>
          <select id="version-select" disabled>
            <option>正在检测...</option>
          </select>
        </label>

        <div class="details" id="install-details">
          <div class="detail-row">
            <span>汉化状态</span>
            <span class="status-badge neutral" id="patch-status">检测中</span>
          </div>
          <div class="detail-row">
            <span>原文件备份</span>
            <strong id="backup-status">--</strong>
          </div>
        </div>

        <div class="notice hidden" id="notice" role="status" aria-live="polite">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v4.5M12 16h.01"></path>
          </svg>
          <span id="notice-text"></span>
        </div>

        <div class="actions">
          <button class="button primary" id="patch-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 4 4L19 6"></path>
            </svg>
            <span>应用汉化</span>
          </button>
          <button class="button secondary" id="restore-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8v6h6M5.5 14A7 7 0 1 0 7 6.5L4 9"></path>
            </svg>
            <span>还原英文</span>
          </button>
        </div>
        <p class="action-hint" id="action-hint">操作前请关闭 GitHub Desktop。</p>
      </section>

      <footer class="footer">
        <span>开源、离线运行，不收集任何数据</span>
        <button id="repository-button" type="button">查看项目主页</button>
      </footer>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
